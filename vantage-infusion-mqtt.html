<script type="text/javascript">
    RED.nodes.registerType('vantage-infusion-mqtt', {
        category: 'Vantage Infusion',
        color: '#DDA0DD',
        defaults: {
            name: { value: "" },
            controller: { value: "", type: "vantage-controller", required: true },
            load: { value: "" },
            load_sync: { value: true },
            blind: { value: "" },
            blind_sync: { value: true },
            sensor: { value: "" },
            sensor_sync: { value: true },
            variable: { value: "" },
            variable_sync: { value: true },
            buttons_string: { value: "" },
            button_sync: { value: false },
            task: { value: "" },
            thermostat: { value: "" },
            thermostat_sync: { value: true },
            led: { value: "" },
            led_sync: { value: true },
            sync_startup: { value: true },
            sync_period: { value: 300 },
            watchdog: { value: true },
            mqtt_discovery: { value: false },
            discovery_prefix: { value: "homeassistant" },
            debug: { value: false }
        },
        inputs: 1,
        outputs: 2,
        inputLabels: function() { return "MQTT / Host Commands"; },
        outputLabels: ["MQTT", "Vantage Raw"],
        icon: "font-awesome/fa-exchange",
        label: function () {
            return this.name || "Vantage Infusion";
        },
        oneditprepare: function () {
            $("#node-input-mqtt_discovery").change(function () {
                if ($(this).is(":checked")) {
                    $("#discovery-prefix-row").show();
                } else {
                    $("#discovery-prefix-row").hide();
                }
            });
        }
    });
</script>

<script type="text/html" data-help-name="vantage-infusion-mqtt">
    <p>Bridge bidirezionale avanzato tra <b>Vantage InFusion</b> (Host Commands) e <b>MQTT</b> con doppia uscita.</p>

    <h3>Uscite</h3>
    <ol>
        <li><b>Uscita 1 (MQTT)</b>: Invia payload JSON formattati per broker MQTT e Home Assistant, oltre ai messaggi di Auto-Discovery.</li>
        <li><b>Uscita 2 (Vantage Raw)</b>: Emette la stringa raw dell'evento ricevuto dal controller (es. <code>R:LOAD 120 100</code>).</li>
    </ol>

    <h3>Ingresso</h3>
    <p>Riceve comandi MQTT sui topic configurati o comandi diretti Host Command:</p>
    <ul>
        <li><code>&lt;VID&gt;/load/vantage/set</code>: <code>"ON"</code>, <code>"OFF"</code> o livello luminosità <code>0-255</code>.</li>
        <li><code>&lt;VID&gt;/blind/vantage/set</code>: <code>"OPEN"</code>, <code>"CLOSE"</code>, <code>"STOP"</code> o posizione <code>0-100</code>.</li>
        <li><code>&lt;VID&gt;/button/vantage/set</code>: <code>"PRESS"</code>, <code>"RELEASE"</code>, <code>"TAP"</code>.</li>
        <li><code>&lt;VID&gt;/task/vantage/set</code>: <code>"BOOT"</code> o nome del trigger.</li>
        <li><code>&lt;VID&gt;/variable/vantage/set</code>: nuovo valore numerico o testuale.</li>
        <li><code>all/vantage/sync</code>: forza la sincronizzazione di tutti i dispositivi configurati.</li>
    </ul>
</script>
